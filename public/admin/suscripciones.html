<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Suscripciones — Administración SuscriPet</title>
    <script>
      tailwind = {
        config: {
          theme: {
            extend: {
              colors: {
                ink: "#183b35",
                leaf: "#287a65",
                mint: "#e8f4ee",
                sand: "#f7f5ef",
                coral: "#ed8064",
              },
              boxShadow: { soft: "0 18px 55px rgba(24,59,53,.08)" },
            },
          },
        },
      };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/output.css" />
  </head>
  <body class="bg-[#f6f8f6]" data-resource="subscriptions">
    <main class="container-wide py-8">
      <header>
        <a class="text-sm font-bold text-leaf" href="/admin/index.html"
          >← Administración</a
        >
        <h1 class="mt-3 text-3xl font-black">Suscripciones</h1>
        <p class="mt-2 text-slate-500">
          Revisa solicitudes y estado de los planes de la comunidad.
        </p>
      </header>
      <section class="surface mt-7 p-5">
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div><h2 class="text-xl font-extrabold">Solicitudes por aprobar</h2><p class="mt-1 text-sm text-slate-500">Al aprobar una solicitud, el plan y sus beneficios quedan activos de inmediato.</p></div>
          <span class="rounded-full bg-sand px-4 py-2 text-sm font-bold" data-pending-count>Buscando…</span>
        </div>
        <div class="mt-5 overflow-x-auto" data-subscription-review><div class="h-24 animate-pulse rounded-xl bg-slate-50"></div></div>
      </section>
      <section class="surface mt-7 p-5">
        <div data-admin-table>
          <div class="h-32 animate-pulse rounded-xl bg-slate-50"></div>
        </div>
      </section>
    </main>
    <script src="/js/admin-nav.js" defer></script><script src="/js/api.js" defer></script>
    <script src="/js/app.js" defer></script>
    <script src="/js/admin.js" defer></script><script src="/js/admin-crud.js" defer></script><script src="/js/admin-subscriptions.js" defer></script>
  </body>
</html>
